name: Docker Image CI

on:
  push:
    branches: [dev, krun]
  workflow_run:
    workflows: ["Bump version"]
    types: [completed]
    branches: [main]

jobs:
  buildx:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Select development channel
        if: ${{ github.ref_name == 'dev' }}
        run: echo "RELEASE_CHANNEL=-dev" >> "$GITHUB_ENV"
      - name: Select krun channel
        if: ${{ github.ref_name == 'krun' }}
        run: echo "RELEASE_CHANNEL=-krun" >> "$GITHUB_ENV"
      - name: Load reproducible pins
        run: grep -vE '^[[:space:]]*(#|$)' reproducible.env >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_REF }}
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push multi-architecture image
        run: |
          ./build_docker_compose.sh --push \
            --set "*.platform=linux/amd64,linux/arm64" \
            --set "*.tags=ghcr.io/spr-networks/spr-opencanary:${RELEASE_VERSION}${RELEASE_CHANNEL}" \
            --set "*.tags=ghcr.io/spr-networks/spr-opencanary:latest${RELEASE_CHANNEL}"
      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/spr-networks/spr-opencanary:${RELEASE_VERSION}${RELEASE_CHANNEL}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.6.0
      - name: Generate SLSA provenance predicate
        run: |
          cat > /tmp/predicate.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://actions.github.io/buildtypes/workflow/v1",
              "externalParameters": {
                "workflow": {
                  "ref": "${{ github.ref }}",
                  "repository": "${{ github.server_url }}/${{ github.repository }}",
                  "path": ".github/workflows/docker-image.yml"
                }
              },
              "internalParameters": {
                "github": {
                  "event_name": "${{ github.event_name }}",
                  "repository_id": "${{ github.repository_id }}",
                  "repository_owner_id": "${{ github.repository_owner_id }}"
                }
              },
              "resolvedDependencies": [
                {
                  "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                  "digest": { "gitCommit": "${{ github.sha }}" }
                }
              ]
            },
            "runDetails": {
              "builder": {
                "id": "${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker-image.yml@${{ github.ref }}"
              },
              "metadata": {
                "invocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
              }
            }
          }
          EOF
      - name: Attest build provenance with GitHub OIDC Token
        env:
          IMG: ghcr.io/spr-networks/spr-opencanary@${{ steps.digest.outputs.digest }}
        run: |
          cosign attest --yes --type slsaprovenance1 \
            --predicate /tmp/predicate.json "${{ env.IMG }}"
      - name: Verify attestation
        env:
          IMG: ghcr.io/spr-networks/spr-opencanary@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/spr-networks/spr-opencanary/\.github/workflows/docker-image\.yml@' \
            "${{ env.IMG }}"
