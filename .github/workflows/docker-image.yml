name: Docker Image CI

on:
  push:
    branches: [dev, krun]
  workflow_run:
    workflows: ["Bump version"]
    types: [completed]
    branches: [main]

jobs:
  buildx:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Select development channel
        if: ${{ github.ref_name == 'dev' }}
        run: echo "RELEASE_CHANNEL=-dev" >> "$GITHUB_ENV"
      - name: Select krun channel
        if: ${{ github.ref_name == 'krun' }}
        run: echo "RELEASE_CHANNEL=-krun" >> "$GITHUB_ENV"
      - name: Load reproducible pins
        run: grep -vE '^[[:space:]]*(#|$)' reproducible.env >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_REF }}
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push multi-architecture image
        run: |
          ./build_docker_compose.sh --push \
            --set "*.platform=linux/amd64,linux/arm64" \
            --set "*.tags=ghcr.io/spr-networks/spr-opencanary:${RELEASE_VERSION}${RELEASE_CHANNEL}" \
            --set "*.tags=ghcr.io/spr-networks/spr-opencanary:latest${RELEASE_CHANNEL}"
